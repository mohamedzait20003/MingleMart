<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your MingleMart password was changed</title>
  </head>
  <body style="margin:0; padding:24px; background:#f3f4f6;
               font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
               color:#111827; line-height:1.6;">
    <div style="max-width:560px; margin:0 auto; background:#ffffff;
                border-radius:12px; padding:32px;">
      <h1 style="margin:0 0 16px; font-size:20px;">Your password was changed</h1>
      <p style="margin:0 0 24px;">Hi {{firstName}}, your MingleMart password has just been updated.</p>
      <p style="margin:0; color:#6b7280; font-size:13px;">
        If this was not you, reset your password immediately &mdash; every existing session
        has already been signed out.
      </p>
    </div>
  </body>
</html>
