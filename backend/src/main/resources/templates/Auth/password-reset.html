<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your MingleMart password</title>
  </head>
  <body style="margin:0; padding:24px; background:#f3f4f6;
               font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
               color:#111827; line-height:1.6;">
    <div style="max-width:560px; margin:0 auto; background:#ffffff;
                border-radius:12px; padding:32px;">
      <h1 style="margin:0 0 16px; font-size:20px;">Reset your password</h1>
      <p style="margin:0 0 24px;">Hi {{firstName}}, use the link below to choose a new password.</p>
      <p style="margin:0 0 24px;">
        <a href="{{resetUrl}}"
           style="display:inline-block; background:#2563eb; color:#ffffff;
                  padding:12px 24px; border-radius:8px; text-decoration:none;
                  font-weight:500;">Reset password</a>
      </p>
      <p style="margin:0; color:#6b7280; font-size:13px;">
        This link expires in 1 hour. If you did not request this, no action is needed &mdash;
        your password has not changed.
      </p>
    </div>
  </body>
</html>
