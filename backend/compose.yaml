services:
  # Behind a profile on purpose: Spring's Docker Compose Support reads this file
  # when the app runs on your host and starts every service it finds, so an
  # unguarded app service would boot a second copy of itself in a container.
  #
  #   docker compose --profile full up --build   whole stack in containers
  #   ./mvnw spring-boot:run                     app on the host, deps in Docker
  app:
    profiles: ['full']
    build:
      context: .
    container_name: 'minglemart-app'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/minglemart'
      - 'SPRING_DATASOURCE_USERNAME=minglemart'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      - 'REDIS_HOST=redis'
      - 'REDIS_PORT=6379'
      - 'HTTP_LOG_REQUESTS=true'
      - 'MINGLEMART_TOKEN_SECRET=${MINGLEMART_TOKEN_SECRET:-dev-only-secret-change-me-min-32-bytes!!}'
      - 'GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}'
      - 'FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}'
    ports:
      - '8080:8080'

  postgres:
    image: 'postgres:18-alpine'
    container_name: 'minglemart-postgres'
    environment:
      - 'POSTGRES_DB=minglemart'
      - 'POSTGRES_USER=minglemart'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      # 5433 on the host, not 5432: a native postgresql-x64-18 service already
      # holds 5432 on this machine. Both can bind — Docker takes the IPv6
      # wildcard and the service the IPv4 one — so an app on the host resolves
      # localhost to IPv4 and silently reaches the wrong database. Spring's
      # Compose Support reads whichever port Docker mapped, so nothing else
      # needs to change. The container still serves 5432 inside the network.
      - '5433:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minglemart -d minglemart']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: 'redis:8-alpine'
    container_name: 'minglemart-redis'
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
